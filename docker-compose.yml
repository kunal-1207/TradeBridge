version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradebridge-postgres
    environment:
      POSTGRES_USER: tradebridge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tradebridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebridge -d tradebridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tradebridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  zipkin:
    image: openzipkin/zipkin
    container_name: tradebridge-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus
    container_name: tradebridge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: tradebridge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
