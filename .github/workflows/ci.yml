name: TradeBridge CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test .NET Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TradeBridge.sln

      - name: Build solution
        run: dotnet build TradeBridge.sln --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test tests/TradeBridge.UnitTests/TradeBridge.UnitTests.csproj --no-build -c Release

  docker-build-and-scan:
    name: Build Docker Images and Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service: [
          'TradeBridge.ApiGateway', 
          'TradeBridge.OrderService', 
          'TradeBridge.RiskService', 
          'TradeBridge.ExecutionService', 
          'TradeBridge.LiquidityProvider'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case service name
        id: string
        run: echo "IMAGE_NAME=$(echo ${{ matrix.service }} | awk -F'.' '{print tolower($2)}')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t ghcr.io/kunal/tradebridge-${{ env.IMAGE_NAME }}:latest --build-arg SERVICE_NAME=${{ matrix.service }} -f Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/kunal/tradebridge-${{ env.IMAGE_NAME }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
